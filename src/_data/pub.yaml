id: eo-dichotomy
show: [d]
title: "A Dichotomy for Constrained Eulerian Orientations"
authors: [Jincheng Guan, Shuai Shao, Ke Shi]
type: manuscript
year: 2026
bib: 2026, Submitted.
abstract: >
    We establish a complete complexity dichotomy for deciding whether a graph admits an Eulerian orientation satisfying local Boolean constraints at vertices. We denote this problem by $\mathrm{EO}$. For every fixed finite set of constraints, the problem is either polynomial-time solvable or NP-complete. The classification identifies two new tractable classes. In particular, one such class is obtained by exploiting the promise polymorphism condition used for proving tractability in counting $\mathrm{EO}$ [\[GSS26\]](#eo-lp). For the hardness proof, we develop a nonconstructive reduction based on unsatisfiable instances and show how failures of the promise conditions yield obstructions to affine and bijunctive tractability, leading to NP-hardness through Schaefer's dichotomy.
    <br />
    Combining our $\mathrm{EO}$ dichotomy with the classification of bipartite edge constraint satisfaction problems, we also classify the complexity of general graph orientation problems assuming both unary pinning constraints are available. Every such problem is polynomial-time solvable or NP-complete, except for a residual family of unresolved $\Delta$-matroid parity cases. These results advance the classification of constraint satisfaction problems with restricted variable occurrences and connect their tractability to promise polymorphisms.

