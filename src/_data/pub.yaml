# manuscripts

---
id: er-zero-freeness
show: [d]
title: "Zero-Freeness and Deterministic Counting on Erdős–Rényi Random Graphs"
authors: [Ke Shi]
type: manuscript
year: 2026
bib: 2026, Manuscript.
notes:
 - 'A [Lean 4 formalization](https://github.com/KeShih/ER-zero-freeness) of the zero-freeness results is available.'
abstract: >
    We establish complex zero-freeness and deterministic fully polynomial-time approximation schemes (FPTASes) for spin systems on the Erdős–Rényi random graph $G(n,d/n)$. For the antiferromagnetic $q$-state Potts model ($q\ge3$) with $d<d_2(q)\sim2q\log q$, the partition function is with high probability zero-free on a fixed-width neighborhood of $[0,1]$, including proper $q$-colorings at $z=0$; this yields a deterministic FPTAS for $q\ge(1/2+\eta)d/\log d$ (fixed $\eta>0$, large $d$), and, combined with the Achlioptas–Naor noncolorability bound, a deterministic FPTAS for counting proper $q$-colorings for all but at most one integer $q$ at each fixed $d>0$. An appendix extends the zero-freeness and the FPTAS up to the Erdős–Rényi condensation threshold of the Potts model, including proper colorings. For the zero-field Ising antiferromagnet and the zero-field Viana–Bray diluted spin glass on $G(n,d/n)$, we likewise obtain fixed-width zero-free neighborhoods and deterministic FPTASes up to their Kesten–Stigum thresholds. Dividing out each graph's forest weight removes the order-$\sqrt n$ fluctuations of the log-partition function caused by the random number of edges; complex moment bounds and Poisson short-cycle Taylor truncations then transfer nonvanishing from an explicit random cycle model, compensated where necessary, while connected-set Möbius inversion and Cayley's tree bound handle unbounded degrees in Barvinok interpolation.

