id: eo-lp
show: [d]
title: "An LP Algorithm for Counting Eulerian Orientations Through the Lens of Quasi-polymorphism"
authors: [Jincheng Guan, Shuai Shao, Ke Shi]
type: manuscript
year: 2026
bib: 2026, Manuscript.
notes:
 - 'The [poster](/files/presentations/eo-lp-poster.pdf) was accepted to the "Can AI do Theory?" workshop at STOC 2026.'
abstract: >
    The counting weighted Eulerian orientation problem $\#\mathrm{EO}$ is a central obstruction in the classification of complex-valued Boolean Holant problems. A recent result gave an $\mathrm{FP}^{\mathrm{NP}}$ versus $\#\mathrm P$-hard dichotomy for $\#\mathrm{EO}$. Its tractable side is described by quasi-polymorphisms, namely one-sided ternary XOR polymorphism conditions, together with membership in one of two tractable pairing classes.
    <br />
    We remove the NP oracle from the tractable side. For every signature set satisfying these conditions, we give a deterministic polynomial-time algorithm. The algorithm solves a natural linear program, extracts at each vertex a local candidate set, and shows that the LP constraints upgrade the quasi-polymorphism condition into full ternary XOR polymorphism on these candidate sets. This yields affine local structure, from which the instance reduces to a tractable Boolean $\#\mathrm{CSP}$. Hence $\#\mathrm{EO}$ satisfies a genuine FP versus $\#\mathrm P$-hard dichotomy.

---
id: matching-ssm
show: [d]
title: "Strong spatial mixing for the matching polynomial: A simple proof via Heilmann-Lieb Theorem"
authors: [Shuai Shao, Ke Shi]
type: manuscript
year: 2025
bib: 2025, Submitted.
abstract: >
    We study the connections between strong spatial mixing and zero-freeness, the two main notions used to devise deterministic approximation algorithms for counting problems.
    Following a recent framework introduced by [Regts, G. (2023). Absence of zeros implies strong spatial mixing. Probability Theory and Related Fields, 186(1), 621-641.] for the vertex model, we show that the implication from zero-freeness of the partition function to strong spatial mixing also works for the matching polynomial, a typical counting problem in the edge model.
    Based on Heilmann and Lieb's results, a zero-free region $C_\Delta=\C \backslash (-\infty,-\frac{1}{4(\Delta-1)}]$ of the partition function and a Christoffel--Darboux type identity, we give a very simple proof for strong spatial mixing of the matching polynomial on graphs of degree bounded by $\Delta$ with any complex edge parameter $z \in C_\Delta$.
    This proof does not rely on the tree recursion which is commonly used  for proving strong spatial mixing in previous results.

