id: hardcore-cc
show: [d]
title: "Zero-Freeness of the Hard-Core Model with Bounded Connective Constant"
authors: [Yuan Chen, Shuai Shao, Ke Shi]
type: conference
year: 2026
pub: ISAAC
abstract: >
    We investigate zero-free regions of the partition function of the hard-core model on finite graphs and their implications for the analyticity of free energy on infinite lattices. Classical results establish zero-freeness up to the tree uniqueness threshold based on maximum degree, but the connective constant offers a tighter structural measure for graphs like regular lattices. We bridge this gap by defining the connective constant for finite graphs via a lower bound on the number of self-avoiding walks. We prove zero-freeness in a complex neighborhood for graph families with lower connective constant $\mu$ when $\lambda < \lambda_c(\mu)$, establishing uniqueness and analyticity of the free energy density for infinite lattices beyond maximum-degree bounds. The proof uses a block contraction technique that lifts the correlation decay property from a real interval to a strip-like complex neighborhood.

---
id: continuous-ssm
show: [d]
title: "Strong Spatial Mixing for Continuous Spin Systems with Multi-Interactions"
authors: [Shuai Shao, Ke Shi, Bohan Wang]
type: conference
year: 2026
pub: ISAAC
abstract: >
    We study spatial correlation decay, focusing on strong spatial mixing (SSM), for continuous spin systems with multi-interactions on hypergraphs. For several classes of discrete spin systems, zero-freeness of the partition function and SSM have been related in both directions. For continuous spin systems, this relationship is less understood. In this paper, we prove that a uniform pinned zero-free disk about $\beta = 0$ implies SSM throughout that disk for continuous spin systems with bounded interactions. Combined with the zero-freeness result of Barvinok, this gives SSM for systems whose interactions are $1$-Lipschitz in the Hamming metric, on hypergraphs with maximum degree $\Delta$ and maximum edge size $r$, for all complex $\beta$ with $|\beta| < 1/(3\Delta\sqrt{r-1})$. The SSM constants are uniform over the system size, the product reference measures, and all valid product boundary events.
    <br />
    A key technical contribution of this paper is a divisibility relation for partition functions of continuous spin systems. We follow the local dependence of coefficients (LDC) framework developed for discrete systems and extend its divisibility step to integral partition functions. The Taylor coefficients in our divisibility identity are sums of integrals of products of interactions, with repeated hyperedges allowed. A measure-preserving swap of two configurations, together with a reindexing of the interaction factors, cancels all contributions below the distance between the boundary supports. This shows how the LDC and zero-freeness approaches fit together; algorithmic running times additionally depend on how the continuous interactions and the required integrals are represented and computed.

---
id: ising-weitz
show: [d]
title: "Zero-Freeness is All You Need: A Weitz-Type FPTAS for the Entire Lee–Yang Zero-Free Region"
authors: [Shuai Shao, Ke Shi]
type: conference
year: 2026
pub: ITCS
abstract: >
    We present a Weitz-type FPTAS for the ferromagnetic Ising model across the entire Lee–Yang zero-free region, without relying on the strong spatial mixing (SSM) property. Our algorithm is Weitz-type for two reasons. First, it expresses the partition function as a telescoping product of ratios, with the key being to approximate each ratio. Second, it uses Weitz’s self-avoiding walk tree, and truncates it at logarithmic depth to give a good and efficient approximation. The key difference from the standard Weitz algorithm is that we approximate a carefully designed edge-deletion ratio instead of the marginal probability of a vertex’s spin, ensuring our algorithm does not require SSM.
    <br />
    Furthermore, by establishing local dependence of coefficients (LDC), we indeed prove a novel form of SSM for these edge-deletion ratios, which, in turn, implies the standard SSM for the random cluster model. This is the first SSM result for the random cluster model on general graphs, beyond lattices. We prove LDC using a new division relation, and remarkably, such relations hold quite universally. As a result, we establish LDC for a variety of models. Combined with existing zero-freeness results for these models, we derive new SSM results for them. Our work suggests that both Weitz-type FPTASes and SSM can be derived from zero-freeness, while zero-freeness alone suffices for Weitz-type FPTASes, SSM additionally requires LDC, a combinatorial property independent of zero-freeness.

